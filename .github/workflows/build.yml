name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ignis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node build.js
      - run: node --check ignis.user.js
      - name: Verify committed build is current
        run: git diff --exit-code -- ignis.user.js
      - name: Test runtime contracts and release rules (no publishing)
        run: |
          node --test tests/core.test.cjs
          python3 tests/release_test.py
      - name: Install test-only browser driver and media verifier
        run: |
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/ignis-venv"
          "$RUNNER_TEMP/ignis-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tests/requirements-browser.txt
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            # The runner's regional mirror can stall; use the canonical Ubuntu
            # archive with bounded retries and avoid optional dependencies.
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g; s|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Exercise the committed bundle in Chromium with offline page and media fixtures
        run: '"$RUNNER_TEMP/ignis-venv/bin/python" tests/browser.py --chrome "$(command -v google-chrome || command -v chromium)" --out "$RUNNER_TEMP/ignis-browser"'
      - name: Retain browser test receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ignis-browser-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ignis-browser
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node build.js
      - run: node --check ignis.user.js
      - name: Publish or verify the immutable stable asset
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: mheci
          GIT_COMMITTER_EMAIL: 274998646+mheci@users.noreply.github.com
        run: bash scripts/release.sh
