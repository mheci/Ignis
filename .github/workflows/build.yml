name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ignis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node build.js
      - run: node --check ignis.user.js
      - name: Verify committed build is current
        run: git diff --exit-code -- ignis.user.js

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node build.js
      - run: node --check ignis.user.js
      - name: Tag and release when artifact @version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: mheci
          GIT_COMMITTER_EMAIL: 274998646+mheci@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"
          VER="$(sed -nE 's|^// @version[[:space:]]+([^[:space:]]+).*|\1|p' ignis.user.js | head -n1)"
          echo "artifact @version: ${VER}"
          test -n "${VER}"
          TAG="v${VER}"
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${TAG} already published, nothing to do"
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} already exists, attaching release to it"
          else
            git tag -a "${TAG}" -m "IGNIS ${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi
          gh release create "${TAG}" ignis.user.js --repo "$GITHUB_REPOSITORY" --title "IGNIS ${TAG}" --notes " " --latest
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f body="" >/dev/null
      - name: Verify published channel serves the new version
        run: |
          set -euo pipefail
          sleep 5
          code="$(curl -sSL -o /tmp/pub.js -w '%{http_code}' https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ignis.user.js)"
          echo "GET releases/latest/download/ignis.user.js -> HTTP ${code}"
          test "${code}" = "200"
          grep -q "@version" /tmp/pub.js && echo "channel carries a userscript payload"
